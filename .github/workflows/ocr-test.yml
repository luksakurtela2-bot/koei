name: ocr-test
on:
  push:
    paths: ["debug/ocr_test.py"]
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q pymupdf==1.26.3
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hrv > /dev/null
          python debug/ocr_test.py
          git config user.name koei-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/ocr.txt; git commit -m "OCR test"; git pull --rebase origin main; git push
